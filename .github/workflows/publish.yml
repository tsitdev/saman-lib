name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun
        run: |
          bun_version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "bun@$bun_version"

      - name: Check release version and select npm tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must match package.json version: v${version}`)
          }

          const prerelease = version.split('+')[0].split('-')[1]
          const distTag = prerelease
            ? /^(alpha|beta|rc)(?:[.\d-]|$)/.exec(prerelease)?.[1] ?? 'next'
            : 'latest'
          appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${distTag}\n`)
          NODE

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check lint, formatting and types
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Build and check package consumers
        run: bun run test:package

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest --ignore-scripts

      - name: Publish to npm
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run: npm publish --access public --provenance --ignore-scripts --tag "$NPM_DIST_TAG"
